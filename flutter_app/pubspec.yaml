name: ai_mindmap
description: "AI Mind Mapping & Diagram Generation App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  webview_flutter: ^4.7.0
  shared_preferences: ^2.3.0
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  printing: ^5.13.1
  pdf: ^3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.jpeg